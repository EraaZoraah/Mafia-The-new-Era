name: Test and publish Mafia
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/audit-language-coverage.mjs
      - run: node scripts/audit-language-coverage.mjs --es
      - run: node scripts/audit-language-coverage.mjs --fr
      - run: node scripts/audit-language-coverage.mjs --de
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mafia-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image and persistent-data restart
        run: bash docker/smoke-test.sh mafia-ci:test
      - name: Validate production Compose
        env:
          MAFIA_IMAGE: ghcr.io/eraazoraah/mafia-the-new-era:ci
          PUBLIC_ORIGIN: https://mafia.example.com
        run: docker compose -f compose.yml config --quiet
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: mafia-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Release details
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # An existing tag is never rebuilt or overwritten. Fail closed on API errors.
          TAGS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          if printf '%s\n' "$TAGS" | grep -Fxq "container-v$VERSION"; then
            gh release view "container-v$VERSION" >/dev/null
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.exists != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.exists != 'true'
      - uses: docker/login-action@v3
        if: steps.release.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        if: steps.release.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create release after image publication
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          printf 'Ready-built image: `%s:%s`\n\n' "$IMAGE" "$VERSION" > /tmp/mafia-release-notes.md
          printf 'Back up SQLite before updating. See DEPLOYMENT.md for Portainer re-pull instructions and GHCR public visibility setup.\n\n' >> /tmp/mafia-release-notes.md
          cat CHANGELOG.md >> /tmp/mafia-release-notes.md
          gh release create "container-v$VERSION" --target "$GITHUB_SHA" --title "Mafia: The New Era $VERSION (container)" --notes-file /tmp/mafia-release-notes.md
